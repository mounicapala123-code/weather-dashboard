<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Weather Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #6c5ce7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px #0002;
        }

        h1 {
            color: #34495e;
        }

        .search {
            display: flex;
            gap: 8px;
        }

        input {
            width: 65%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3867d6;
            color: white;
            cursor: pointer;
        }

        #weather {
            margin-top: 25px;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
            color: #3867d6;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .item {
            background: #eef4ff;
            padding: 15px 5px;
            border-radius: 12px;
        }

        #message {
            color: #c0392b;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <h1>🌦️ Weather Dashboard</h1>
        <p>Check the current weather of your city</p>

        <div class="search">
            <input id="city" type="text" placeholder="Enter city name" value="Hyderabad">
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="message"></p>
        <div id="weather"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById("city")
                .value.trim();

            const message = document.getElementById("message");
            const weather = document.getElementById("weather");

            if (!city) {
                message.textContent = "Please enter a city name.";
                return;
            }

            message.textContent = "Loading weather...";
            weather.innerHTML = "";

            try {
                const locationResponse = await fetch(
                    "https://geocoding-api.open-meteo.com/v1/search?name="
                    + encodeURIComponent(city)
                    + "&count=1&language=en&format=json"
                );

                if (!locationResponse.ok) {
                    throw new Error("Location service unavailable.");
                }

                const locationData = await locationResponse.json();

                if (!locationData.results ||
                    locationData.results.length === 0) {
                    throw new Error("City not found. Try another name.");
                }

                const place = locationData.results[0];

                const weatherResponse = await fetch(
                    "https://api.open-meteo.com/v1/forecast"
                    + "?latitude=" + place.latitude
                    + "&longitude=" + place.longitude
                    + "&current=temperature_2m,relative_humidity_2m,"
                    + "wind_speed_10m,weather_code"
                );

                if (!weatherResponse.ok) {
                    throw new Error("Weather service unavailable.");
                }

                const data = await weatherResponse.json();
                const current = data.current;

                const conditions = {
                    0: "☀️ Clear sky",
                    1: "🌤️ Mostly clear",
                    2: "⛅ Partly cloudy",
                    3: "☁️ Cloudy",
                    45: "🌫️ Foggy",
                    48: "🌫️ Foggy",
                    51: "🌦️ Light drizzle",
                    53: "🌦️ Drizzle",
                    55: "🌧️ Heavy drizzle",
                    61: "🌧️ Light rain",
                    63: "🌧️ Rain",
                    65: "🌧️ Heavy rain",
                    71: "❄️ Light snow",
                    73: "❄️ Snow",
                    75: "❄️ Heavy snow",
                    80: "🌦️ Rain showers",
                    81: "🌧️ Rain showers",
                    82: "🌧️ Heavy showers",
                    95: "⛈️ Thunderstorm"
                };

                const condition =
                    conditions[current.weather_code] ||
                    "🌡️ Weather information";

                message.textContent = "";

                weather.innerHTML = `
          <h2>${place.name}, ${place.country || ""}</h2>
          <p class="temperature">
            ${current.temperature_2m}°C
          </p>
          <h3>${condition}</h3>

          <div class="details">
            <div class="item">
              💧 Humidity
              <h3>${current.relative_humidity_2m}%</h3>
            </div>
            <div class="item">
              💨 Wind speed
              <h3>${current.wind_speed_10m} km/h</h3>
            </div>
          </div>

          <p>Updated: ${current.time.replace("T", " ")}</p>
        `;
            } catch (error) {
                message.textContent = error.message ||
                    "Unable to load weather. Check your internet.";
            }
        }

        document.getElementById("city")
            .addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    getWeather();
                }
            });

        getWeather();
    </script>
</body>

</html>
